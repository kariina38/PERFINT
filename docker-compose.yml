services:
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: finance_tracker_backend
    restart: always
    ports:
      - "3001:3001"
    env_file:
      - ./server/.env
    environment:
      - PORT=3001
      - NODE_ENV=production

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: finance_tracker_frontend
    restart: always
    ports:
      - "80:80"
      - "5173:80"
    depends_on:
      - backend
